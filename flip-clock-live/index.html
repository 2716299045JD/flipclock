.row{ display:flex; align-items:center; justify-content:center; gap:calc(var(--u) * .07); }

.card{

  border-radius:calc(var(--u) * .105);

.face.bottom{

  border-top:.5px solid var(--seam);

.flap{ z-index:3; }
.flap-top{

  background:var(--flap-top);

}
.flap-top span{ top:0; }
.flap-bottom{

  transform:rotateX(90deg) translateZ(.02px);
  border-radius:0 0 calc(var(--u) * .105) calc(var(--u) * .105);
  background:var(--flap-bottom);

}

.card.flipping .flap-bottom{ animation:flipBottom .32s .3s cubic-bezier(.2,.62,.34,1) forwards; }

#sheet{

}

.sw{

}
.sw::after{
  content:"";
  position:absolute; left:50%; top:50%;

#toast{

  z-index:60;
  white-space:nowrap;
}
#toast.on{ opacity:1; transform:translate(-50%,0); }

}
